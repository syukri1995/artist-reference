name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set build version
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v(.+)$') {
            $version = $Matches[1]
          } elseif ($ref) {
            $version = "$ref-dev"
          } else {
            $version = "0.0.0-dev"
          }
          "ARTIST_REF_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building version $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: pyinstaller --noconfirm artist_ref_manager.spec

      - name: Smoke test executable
        shell: pwsh
        run: ./scripts/smoke_test_exe.ps1

      - name: Package release zip
        shell: pwsh
        run: |
          Copy-Item release/README.txt dist/README.txt
          Copy-Item LICENSE dist/LICENSE
          Copy-Item NOTICES.txt dist/NOTICES.txt
          Copy-Item .env.example dist/.env.example
          Compress-Archive -Path @(
            "dist/ArtistReferenceManager.exe",
            "dist/README.txt",
            "dist/LICENSE",
            "dist/NOTICES.txt",
            "dist/.env.example"
          ) -DestinationPath dist/ArtistReferenceManager-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtistReferenceManager-Windows
          path: |
            dist/ArtistReferenceManager.exe
            dist/ArtistReferenceManager-win64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ArtistReferenceManager.exe
            dist/ArtistReferenceManager-win64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
